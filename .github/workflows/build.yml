# Alpha builds: runs on every branch push.
# Uploads the build to CurseForge as an alpha and publishes it as a GitHub
# pre-release (with release.json, so WowUp users on the beta/alpha channel get it).
# Tagged commits are handled by release.yml instead.
name: Build alpha

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # CF_API_KEY is an environment secret of the "Build" environment
    environment: Build

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gets git history for changelogs

      # Our own build-N tags would otherwise show up in the version name
      # (LunarSphere-build-2-1-g<sha>.zip). A commit with a version tag is released
      # by release.yml, so skip it here to avoid uploading it twice.
      - name: Check tags
        id: tags
        run: |
          git tag -l 'build-*' | xargs -r git tag -d
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD has a version tag, release.yml handles this commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Untagged commits are packaged as alpha and uploaded to CurseForge
      - name: Package and upload alpha
        if: steps.tags.outputs.skip != 'true'
        uses: BigWigsMods/packager@v2

      - name: Write release.json
        id: meta
        if: steps.tags.outputs.skip != 'true'
        run: |
          zip=$(ls .release/*.zip | grep -v -- '-nolib' | head -n 1)
          name=$(basename "$zip")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=${name#LunarSphere-}" | sed 's/\.zip$//' >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          python3 - "$name" > .release/release.json <<'EOF'
          import json, re, sys

          def interfaces(path):
              with open(path, encoding='utf-8-sig') as f:
                  m = re.search(r'^## Interface:\s*(.+)$', f.read(), re.M)
              return [int(v) for v in re.findall(r'\d+', m.group(1))] if m else []

          def flavor(interface):
              if interface >= 100000:
                  return 'mainline'
              return {1: 'classic', 2: 'bcc', 3: 'wrath', 4: 'cata', 5: 'mists'}.get(interface // 10000)

          metadata = []
          for interface in interfaces('LunarSphere/LunarSphere_Mainline.toc'):
              if flavor(interface) == 'mainline':
                  metadata.append({'flavor': 'mainline', 'interface': interface})
                  break
          for interface in interfaces('LunarSphere/LunarSphere_Classic.toc'):
              f = flavor(interface)
              if f and f != 'mainline' and all(m['flavor'] != f for m in metadata):
                  metadata.append({'flavor': f, 'interface': interface})

          print(json.dumps({'releases': [{
              'name': 'LunarSphere',
              'version': sys.argv[1][len('LunarSphere-'):-len('.zip')],
              'filename': sys.argv[1],
              'nolib': False,
              'metadata': metadata,
          }]}, indent=2))
          EOF
          cat .release/release.json

      - name: Publish GitHub pre-release
        if: steps.tags.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LunarSphere ${{ steps.meta.outputs.version }} (alpha, ${{ github.ref_name }})
          body: Alpha build of ${{ github.ref_name }} at ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.meta.outputs.zip }}
            .release/release.json
