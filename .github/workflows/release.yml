# Releases: runs when a version tag is pushed.
# The packager picks the CurseForge release type from the tag name:
#   v1.81          -> release
#   v1.81-beta1    -> beta
#   v1.81-alpha1   -> alpha
# It also creates the GitHub release (with release.json for WowUp); alpha/beta
# tags become GitHub pre-releases.
name: Package and release

on:
  push:
    tags:
      - '**'
      - '!build-*'  # tags created by the alpha build workflow

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # CF_API_KEY is an environment secret of the "Build" environment
    environment: Build

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      #WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      #WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gets git history for changelogs

      # The alpha workflow tags its GitHub pre-releases build-N. Drop those locally so
      # the packager only sees real version tags when naming the release.
      - name: Ignore build tags
        run: git tag -l 'build-*' | xargs -r git tag -d

      # CurseForge shows a changelog per file: use only the newest version's section
      # of LunarSphere/changelog.txt (sections end with a long line of '=')
      - name: Extract changelog for this version
        run: sed '/^=\{40,\}$/,$d' LunarSphere/changelog.txt > CURSEFORGE_CHANGELOG.txt
      - name: Package and release
        uses: BigWigsMods/packager@v2
