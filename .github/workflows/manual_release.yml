# Manually started packaging run (Actions tab -> "Manual package and release").
# Uses the same rules as the automatic workflows: a tagged commit is released with
# the type from its tag name, an untagged commit is uploaded as an alpha.
name: Manual package and release

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # CF_API_KEY is an environment secret of the "Build" environment
    environment: Build

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      #WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      #WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gets git history for changelogs

      - name: Ignore build tags
        run: git tag -l 'build-*' | xargs -r git tag -d

      - name: Package and release
        uses: BigWigsMods/packager@v2
